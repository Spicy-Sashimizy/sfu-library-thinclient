<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23b3261e'/%3E%3Ccircle%20cx='14'%20cy='14'%20r='6'%20fill='none'%20stroke='white'%20stroke-width='2.6'/%3E%3Cpath%20d='M18.5%2018.5L25%2025'%20stroke='white'%20stroke-width='2.6'%20stroke-linecap='round'/%3E%3C/svg%3E">
<title>SFU Library — Suite</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  /* app background (not white) so any momentary gap is on-brand */
  body { background: oklch(97.5% 0.006 80); }
  main.suite-frame { position: relative; width: 100%; height: 100%; background: oklch(97.5% 0.006 80); }
  main.suite-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: oklch(97.5% 0.006 80); }
  /* Loading overlay shown only until the target app has mounted — replaces the
     jarring white flash with a branded, on-background spinner. */
  #loader { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: oklch(97.5% 0.006 80);
    opacity: 1; transition: opacity 0.18s ease; font-family: 'DM Sans', system-ui, sans-serif; }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader .badge { width: 40px; height: 40px; border-radius: 9px; background: oklch(52% 0.18 25);
    display: flex; align-items: center; justify-content: center; }
  #loader .spin { width: 22px; height: 22px; border: 2.5px solid oklch(88% 0.010 250);
    border-top-color: oklch(52% 0.18 25); border-radius: 50%; animation: sp 0.7s linear infinite; }
  #loader .lbl { font-size: 12.5px; color: oklch(44% 0.014 250); letter-spacing: 0.02em; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loader .spin { animation-duration: 2s; } }
</style>
</head>
<body>

<!-- One iframe per app, created lazily and KEPT ALIVE (toggled, never reloaded),
     so switching apps is instant with no white flash or recompile. -->
<main class="suite-frame">
  <div id="loader">
    <div class="badge"><div class="spin"></div></div>
    <div class="lbl">Loading…</div>
  </div>
</main>

<script>
(function () {
  var container = document.querySelector("main.suite-frame");
  var loader = document.getElementById("loader");
  var loaderLbl = loader.querySelector(".lbl");

  var PAGES = { search: "search.html", analytics: "analytics.html", index: "index_manager.html" };
  var LABELS = { search: "Search", analytics: "About this index", index: "Index Manager" };
  // Sub-screens that live INSIDE the Search app.
  var SEARCH_SCREENS = ["search", "saved", "history", "databases", "settings", "admin"];

  var frames = {};        // pageId -> iframe element (created on first use)
  var ready = {};         // pageId -> bool (app has mounted)
  var current = null;     // visible app id
  var pendingScreen = null;

  function pageIdFor(nav) {
    if (PAGES[nav]) return nav;
    if (SEARCH_SCREENS.indexOf(nav) !== -1) return "search";
    return "search";
  }

  function showLoader(on, label) {
    if (label) loaderLbl.textContent = label;
    loader.classList.toggle("hidden", !on);
  }

  // Create + load an app's iframe once. Subsequent calls reuse it.
  function ensureFrame(pageId) {
    if (frames[pageId]) return frames[pageId];
    var f = document.createElement("iframe");
    f.title = "SFU Library — " + (LABELS[pageId] || pageId);
    f.style.display = "none";
    container.appendChild(f);
    frames[pageId] = f;
    // Fallback readiness: if the inner app never posts suiteReady (analytics /
    // index don't), mark ready shortly after the document loads.
    f.addEventListener("load", function () {
      setTimeout(function () { markReady(pageId); }, 450);
    });
    // Mount via fetch+srcdoc so this shell stays the only registered page and
    // relative asset URLs resolve against the project root.
    fetch(PAGES[pageId])
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) { f.srcdoc = html; })
      .catch(function () {
        f.srcdoc = "<p style='font-family:sans-serif;padding:24px'>Could not load " + PAGES[pageId] + "</p>";
        markReady(pageId);
      });
    return f;
  }

  function markReady(pageId) {
    ready[pageId] = true;
    if (pageId === current) showLoader(false);
    if (pageId === current && pendingScreen) { sendScreen(pageId, pendingScreen); pendingScreen = null; }
    // give the freshly-mounted app the current demo state so its pill + AI
    // status match every other app immediately.
    try { frames[pageId].contentWindow.postMessage({ suiteDemo: lastDemo }, "*"); } catch (e) {}
  }

  // Single source of truth for demo/live across the whole suite: probe /health
  // and broadcast {suiteDemo} to every app so the demo pill + AI status are
  // identical everywhere (no per-app disagreement).
  var lastDemo = false;
  function broadcastDemo() {
    Object.keys(frames).forEach(function (k) {
      try { frames[k].contentWindow.postMessage({ suiteDemo: lastDemo }, "*"); } catch (e) {}
    });
  }
  function probeHealth() {
    var done = false;
    var t = setTimeout(function () { if (!done) { done = true; lastDemo = true; broadcastDemo(); } }, 8000);
    fetch("/health").then(function (r) { return r.ok; }).catch(function () { return false; })
      .then(function (ok) { if (done) return; done = true; clearTimeout(t); lastDemo = !ok; broadcastDemo(); });
  }

  function show(pageId) {
    Object.keys(frames).forEach(function (k) {
      frames[k].style.display = (k === pageId) ? "block" : "none";
    });
  }

  function sendScreen(pageId, screen) {
    var f = frames[pageId];
    if (!f) return;
    try { f.contentWindow.postMessage({ suiteScreen: screen }, "*"); } catch (e) {}
  }

  function mount(pageId, screen) {
    pendingScreen = screen || null;
    ensureFrame(pageId);
    show(pageId);
    current = pageId;
    localStorage.setItem("suite-page", pageId);
    if (ready[pageId]) {
      showLoader(false);
      if (pendingScreen) { sendScreen(pageId, pendingScreen); pendingScreen = null; }
    } else {
      showLoader(true, "Loading " + (LABELS[pageId] || "") + "…");
    }
  }

  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d) return;
    if (d.suiteReady) { markReady(pageIdFor(d.suiteReady)); return; }
    if (typeof d.suiteNav === "string") {
      var pageId = pageIdFor(d.suiteNav);
      var screen = (SEARCH_SCREENS.indexOf(d.suiteNav) !== -1) ? d.suiteNav
                 : (typeof d.screen === "string" ? d.screen : null);
      mount(pageId, screen);
    }
  });

  function start() {
    mount(localStorage.getItem("suite-page") || "search", null);
    probeHealth();
    setInterval(probeHealth, 30000);
  }
  if (document.readyState === "complete") start();
  else window.addEventListener("load", start);
})();
</script>

</body>
</html>
