[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truth-drift-auditor"
version = "0.1.0"
description = "Pilot: tiered audit of a draft against a factual corpus and a numerical metrics store (spike)"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.102"]

[project.optional-dependencies]
google = ["google-api-python-client>=2.150", "google-auth-oauthlib>=1.2"]
paperqa = ["paper-qa[zotero,local]>=5"]
dev = ["pytest>=8"]

[project.scripts]
tda = "truth_drift_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["truth_drift_auditor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
