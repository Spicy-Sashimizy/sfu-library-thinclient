# situations_battery.conf — input for bench_matrix.sh (format: that script's header).
#
# The phase-1 battery of TEST_SITUATIONS.md, in the order that file prescribes:
# E7 first (validates the rig cheaply), then E1 (the headline ladder), then E3
# (the novel regime), then E2/E4/E5, then E6/E8.
#
# ORDERING IS LOAD-BEARING: every `table=auto` row builds its chunk table from
# an EARLIER row's result JSON with the same cell signature (skew_seed_r_mib_frac),
# because t1d_cell.py --laydown-only writes no result. Each block therefore
# starts with its `policy=none` classic baseline.
#
# Baselines already measured on 2026-09-05 (data/eval_results/t1d_*_20260905.*)
# are re-run here rather than cross-compared: this rig caps with cgcreate +
# memory.max, the 2026-09-05 cells used `systemd-run --scope -p MemoryMax=`.

# --- E7: warm-path overhead. Everything fits at 8G; both arms should be
#     indistinguishable. Cheapest cell, run it first to validate the rig.
id=E7_none    policy=none                 cap=8   skew=hotset:0.20:0.80 seed=2027
id=E7_empty   policy=hotset table=none    cap=8   skew=hotset:0.20:0.80 seed=2027

# --- E1: the policy ladder at the divergence rung (cap 1.5G, seed 2027),
#     where MGLRU lost 1.443x to classic. Upstream policies are driven through
#     their own loaders; only the hotset arms carry a table.
id=E1_classic policy=none                 cap=1.5 skew=hotset:0.20:0.80 seed=2027
id=E1_fifo    policy=fifo                 cap=1.5 skew=hotset:0.20:0.80 seed=2027
id=E1_s3fifo  policy=s3fifo               cap=1.5 skew=hotset:0.20:0.80 seed=2027
id=E1_lfu     policy=sampling             cap=1.5 skew=hotset:0.20:0.80 seed=2027
id=E1_lhd     policy=lhd                  cap=1.5 skew=hotset:0.20:0.80 seed=2027
id=E1_ctl     policy=hotset table=none    cap=1.5 skew=hotset:0.20:0.80 seed=2027
id=E1_hotset  policy=hotset table=auto    cap=1.5 skew=hotset:0.20:0.80 seed=2027

# --- E3: right-sized protection where classic drowns. h=0.40 puts the hot set
#     (2 GiB) above the 1.5G cap, so the table is truncated to a cap-sized
#     prefix. 1200 MiB leaves headroom under the cap for L and anon.
id=E3_classic policy=none                 cap=1.5 skew=hotset:0.40:0.80 seed=2027
id=E3_full    policy=hotset table=auto    cap=1.5 skew=hotset:0.40:0.80 seed=2027
id=E3_trunc   policy=hotset table=auto limit_mib=1200 cap=1.5 skew=hotset:0.40:0.80 seed=2027

# --- E2: where app knowledge pays, across the cap band.
id=E2_c075_classic policy=none              cap=0.75 skew=hotset:0.20:0.80 seed=2027
id=E2_c075_hotset  policy=hotset table=auto cap=0.75 skew=hotset:0.20:0.80 seed=2027
id=E2_c250_classic policy=none              cap=2.5  skew=hotset:0.20:0.80 seed=2027
id=E2_c250_hotset  policy=hotset table=auto cap=2.5  skew=hotset:0.20:0.80 seed=2027
id=E2_c400_classic policy=none              cap=4    skew=hotset:0.20:0.80 seed=2027
id=E2_c400_hotset  policy=hotset table=auto cap=4    skew=hotset:0.20:0.80 seed=2027

# --- E4: the readahead bomb. fault_around=1 is t1d --fault-around (MADV_NORMAL).
#     Budget the timeout: the classic-fa cell at this rung ran >1800s/pass.
id=E4_classic policy=none              fault_around=1 cap=1.5 skew=hotsetc:0.20:0.80:8 seed=2027
id=E4_hotset  policy=hotset table=auto fault_around=1 cap=1.5 skew=hotsetc:0.20:0.80:8 seed=2027

# --- E6: stale-table robustness. Same cell as E1; the table is corrupted by
#     25 / 50 / 100%, page count preserved, substitutes drawn from R's cold
#     remainder. E1_classic above is the reference floor for this block.
id=E6_c25  policy=hotset table=auto corrupt_frac=0.25 cap=1.5 skew=hotset:0.20:0.80 seed=2027
id=E6_c50  policy=hotset table=auto corrupt_frac=0.50 cap=1.5 skew=hotset:0.20:0.80 seed=2027
id=E6_c100 policy=hotset table=auto corrupt_frac=1.00 cap=1.5 skew=hotset:0.20:0.80 seed=2027

# --- E8: live refresh. NOT ENABLED HERE (it needs its own baseline row, so it
#     is a separate block you uncomment as a unit). Both halves exist since
#     2026-09-06: switch_at=6 moves the WORKLOAD's hot set at pass 6
#     (t1d_cell.py --hotset-switch-pass, seeded from seed^0x5717C8 by default
#     and recorded in the result JSON's hotset_switch block), and
#     refresh_table=auto-epoch1 rewrites the PINNED map at the same pass to the
#     exact hot set the workload switched to (load_hotset.py chunks --epoch 1).
#     The E8_classic row must run first: it is the no-policy floor AND the
#     source result both table=auto and auto-epoch1 read.
# id=E8_classic policy=none              switch_at=6 cap=1.5 skew=hotset:0.20:0.80 seed=2027
# id=E8_static  policy=hotset table=auto switch_at=6 cap=1.5 skew=hotset:0.20:0.80 seed=2027
# id=E8_refresh policy=hotset table=auto switch_at=6 refresh_at=6 refresh_table=auto-epoch1 cap=1.5 skew=hotset:0.20:0.80 seed=2027
#
#     For the older "table goes wrong at pass N under a STEADY workload" form
#     (a timed E6), drop switch_at= and point refresh_table= at a pre-built
#     table, e.g.
#       load_hotset.py chunks --result-json <E1_classic result> \
#           --data-dir /var/tmp/t1d_scratch --corrupt-frac 1.0 \
#           --corrupt-seed 4242 --out /var/tmp/t1d_scratch/e8_second.txt
