# Off-BMP Qdrant — SERVE-ONLY supervision.
#
# Why this exists (incident 2026-06-21): Qdrant ran as a bare `nohup` process,
# unsupervised. Under the heavy 2-pass / 40-query re-measure load it hit ~17.2 GB
# RSS on the 23 GB box (16 GB swap already full) and was OOM-killed. Nothing
# restarted it, so search was down until a manual relaunch. This conf hands the
# *server* to supervisord so the next crash auto-restarts.
#
# Deliberately SERVE-ONLY: the 150M off-BMP ingest is COMPLETE (8/8 worker
# checkpoints done, 150,413,098 points). The ingest program from the (now
# archived, 2026-06-24 — Workstream A4) scripts/archive/qdrant-offbmp.supervisor.conf
# is intentionally NOT included here so supervisord does not relaunch an 8-worker
# job that is finished. This is the ONLY active Qdrant supervisord unit; the
# build-phase units (scripts/archive/migration-150m.supervisor.conf and the
# off-bmp ingest conf above) are retired.
#
# Install:
#   sudo cp scripts/qdrant-serve.supervisor.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread && sudo supervisorctl update
# Status:
#   sudo supervisorctl status qdrant-spike
#
# NOTE: the persisted collection optimizer config carries the OOM-avoidance
# levers (max_optimization_threads=1, max_segment_size=5000000 KB) and survives
# restarts, so no extra flags are needed here.

[program:qdrant-spike]
command=/workspaces/sfu-library-thinclient/.tools/qdrant/qdrant
directory=/workspaces/sfu-library-thinclient/data/qdrant_spike
environment=QDRANT__STORAGE__STORAGE_PATH="/workspaces/sfu-library-thinclient/data/qdrant_spike/storage",HOME="/home/vscode"
user=vscode
autostart=true
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=60
stdout_logfile=/workspaces/sfu-library-thinclient/logs/qdrant_offbmp.log
stdout_logfile_maxbytes=50MB
redirect_stderr=true
stopasgroup=true
killasgroup=true
