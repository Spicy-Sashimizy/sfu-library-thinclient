[package]
name = "inplace_updater"
version = "0.1.0"
edition = "2024"
description = "Bit updater for the in-place format v3 shard (spike/inplace_update/UPDATER_DESIGN.md)"
publish = false

[dependencies]
vectorium = { path = "../../vectorium_fork" }
toolkit = { path = "../../toolkit_fork" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0", features = ["serde"] }
memmap2 = "0.9"
bytemuck = "1.23"
libc = "0.2"
rayon = "1.11"
half = { version = "2.6", features = ["bytemuck", "serde", "std", "num-traits"] }
rand = "0.9"
rand_chacha = "0.9"

[[bin]]
name = "inplace-updater"
path = "src/bin/inplace_updater.rs"

[profile.release]
opt-level = 3
debug = 1

[profile.test]
opt-level = 1
