# Pinned inputs for scripts/portable_linux/build_linux_runtime.sh.
# Config-as-interface: sourced by bash. Changing any pin changes the bundle;
# bump BUNDLE_RECIPE_VERSION and re-measure (docs/infrastructure/PORTABLE_LINUX_BUNDLE.md).

BUNDLE_RECIPE_VERSION=1

# python-build-standalone relocatable CPython. The seismic .so is cp311, so the
# minor version MUST stay 3.11 (PyInit ABI); patch releases within 3.11 are fine.
PBS_TAG=20260924
PBS_PY_VERSION=3.11.16
PBS_ASSET=cpython-3.11.16+20260924-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
PBS_SHA256=68c6739376b65258dee5058ccf6777232fe38d31a578965ae8bda327ec7da3a8
PBS_URL_BASE=https://github.com/astral-sh/python-build-standalone/releases/download

# CPU-only wheel sources. torch comes from the CPU index (+cpu local version);
# everything else from PyPI. The lock file pins every wheel by sha256.
TORCH_CPU_INDEX=https://download.pytorch.org/whl/cpu
PYPI_INDEX=https://pypi.org/simple

# Portable seismic extension (WI-4 x86-64-v3 build, doc 10 section 7.7).
SEISMIC_SO_REL=spike/seismic_upstream/target/portable_so/v3/seismic/seismic.cpython-311-x86_64-linux-gnu.so
SEISMIC_SO_SHA256=6c88c8c7862720b05b0e0eee6747b6483ec8e47b48f6e4a7c8d9e9d7a354d57c
